name: Deploy to EC2
on:
  push:
    branches:
      - develop
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            REPO_DIR="/home/ec2-user/team-checkin"
            WEB_DIR="/var/www/html"
            if [ ! -d "$REPO_DIR" ]; then
              git clone https://github.com/${{ github.repository }}.git "$REPO_DIR"
            else
              cd "$REPO_DIR"
              git fetch origin develop
              git reset --hard origin/develop
            fi
            sudo cp -r "$REPO_DIR"/* "$WEB_DIR/"
            sudo chown -R ec2-user:nginx "$WEB_DIR"
            sudo chmod -R 755 "$WEB_DIR"
            cd "$WEB_DIR"
            npm install
            pm2 restart team-checkin || pm2 start server.js --name team-checkin
            pm2 save
            sudo systemctl reload nginx
            echo "Deployed at $(date)"